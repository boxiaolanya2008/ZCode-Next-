# 构建 Windows / Linux 桌面安装包，并在推 tag v* 时自动发布 GitHub Release。
#
# 触发方式：
#   1) 推送格式为 v* 的 tag（例如 v3.14.0）→ 自动打包并创建 Release（推荐）。
#   2) workflow_dispatch（仓库 Actions 页手动运行）→ 仅打包并上传产物，不创建 Release。
#
# 说明：打包逻辑复用仓库既有 `pnpm bundle:desktop`（脚本内部会跑
# prepare:runtime-assets + pnpm build + electron-builder，并自带依赖/体积校验
# 与 electron 二进制镜像回退重试），无需在这里重复构建步骤。

name: build-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: win
            runner: windows-latest
          - os: linux
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install
        env:
          HUSKY: "0"

      # electron-builder 的 pacman 打包路径依赖 fpm → bsdtar；在 Debian/Ubuntu 上 bsdtar
      # 由 libarchive-tools 提供，不是独立软件包，不能单列。rpm 目标还需 rpm。仅 Linux runner 需要。
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools rpm

      - name: Bundle desktop (${{ matrix.os }} / x64)
        run: pnpm bundle:desktop -- --os ${{ matrix.os }} --arch x64
        env:
          # 强制生产风味：productName=ZCode++、产物不带 Preview/_TEST。
          ZCODE_ENV: "production"
          HUSKY: "0"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.rpm
            packages/desktop/dist/*.pkg.tar.zst

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true